<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoF Design Patterns — C#</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f6f1;
  --surface: #ffffff;
  --surface2: #f0efe8;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --text: #0e0e0c;
  --text-muted: #666660;
  --text-hint: #999993;
  --accent: #1a1a18;
  --tag-cr: #d4f0e2;
  --tag-cr-text: #0a5c33;
  --tag-st: #d6e8fb;
  --tag-st-text: #0a3d7a;
  --tag-bh: #fdefd4;
  --tag-bh-text: #7a4400;
  --btn-active-bg: #0e0e0c;
  --btn-active-text: #f7f6f1;
  --code-bg: #f0efe8;
  --code-border: rgba(0,0,0,0.07);
  --token-kw: #7c3aed;
  --token-type: #0369a1;
  --token-str: #166534;
  --token-cmt: #9ca3af;
  --token-num: #b45309;
  --token-op: #374151;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --radius-lg: 14px;
}
[data-theme="dark"] {
  --bg: #111110;
  --surface: #1c1c1a;
  --surface2: #252522;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.12);
  --text: #e8e7e0;
  --text-muted: #999993;
  --text-hint: #5c5c58;
  --accent: #e8e7e0;
  --tag-cr: #0a3320;
  --tag-cr-text: #5ecc96;
  --tag-st: #08244a;
  --tag-st-text: #5fa8e8;
  --tag-bh: #3d2600;
  --tag-bh-text: #f0a843;
  --btn-active-bg: #e8e7e0;
  --btn-active-text: #111110;
  --code-bg: #151513;
  --code-border: rgba(255,255,255,0.06);
  --token-kw: #a78bfa;
  --token-type: #38bdf8;
  --token-str: #4ade80;
  --token-cmt: #6b7280;
  --token-num: #fb923c;
  --token-op: #d1d5db;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
}
[data-theme="sepia"] {
  --bg: #f5f0e8;
  --surface: #faf7f0;
  --surface2: #ede8de;
  --border: rgba(120,100,60,0.12);
  --border-strong: rgba(120,100,60,0.2);
  --text: #2c2418;
  --text-muted: #7a6848;
  --text-hint: #a89870;
  --accent: #2c2418;
  --tag-cr: #d9f0df; --tag-cr-text: #1a5c2e;
  --tag-st: #d5e5f8; --tag-st-text: #1a3d6e;
  --tag-bh: #fcecd0; --tag-bh-text: #6b3c00;
  --btn-active-bg: #2c2418;
  --btn-active-text: #f5f0e8;
  --code-bg: #ede8de;
  --code-border: rgba(120,100,60,0.1);
  --token-kw: #7c3aed; --token-type: #1d4ed8; --token-str: #15803d;
  --token-cmt: #9ca3af; --token-num: #b45309; --token-op: #374151;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.65; transition: background 0.2s, color 0.2s; }

.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  background: var(--surface);
  border-right: 0.5px solid var(--border-strong);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sidebar-header {
  padding: 1.5rem 1.25rem 1rem;
  border-bottom: 0.5px solid var(--border);
}
.brand {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-hint);
  margin-bottom: 4px;
}
.sidebar-title {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.search-box {
  margin: 0.75rem 1.25rem 0;
  position: relative;
}
.search-box input {
  width: 100%;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 12px 7px 32px;
  font-size: 13px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border 0.15s;
}
.search-box input:focus { border-color: var(--border-strong); }
.search-box input::placeholder { color: var(--text-hint); }
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-hint);
  font-size: 13px;
}
.cat-section { padding: 0.75rem 0 0.5rem; }
.cat-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-hint);
  padding: 0 1.25rem;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.cat-dot {
  width: 6px; height: 6px; border-radius: 50%;
  display: inline-block;
}
.cat-dot.cr { background: var(--tag-cr-text); }
.cat-dot.st { background: var(--tag-st-text); }
.cat-dot.bh { background: var(--tag-bh-text); }
.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 1.25rem;
  cursor: pointer;
  font-size: 13.5px;
  color: var(--text-muted);
  border-left: 2px solid transparent;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  user-select: none;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--surface2); color: var(--text); border-left-color: var(--text); font-weight: 500; }
.nav-item .tag {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 20px;
  font-weight: 500;
}
.tag.cr { background: var(--tag-cr); color: var(--tag-cr-text); }
.tag.st { background: var(--tag-st); color: var(--tag-st-text); }
.tag.bh { background: var(--tag-bh); color: var(--tag-bh-text); }

/* ── Main ── */
.main { overflow: hidden; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 2rem;
  border-bottom: 0.5px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.breadcrumb { font-size: 13px; color: var(--text-muted); }
.breadcrumb span { color: var(--text); font-weight: 500; }
.topbar-right { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 15px;
  transition: background 0.12s, color 0.12s;
}
.icon-btn:hover { background: var(--surface2); color: var(--text); }
.icon-btn.active { background: var(--btn-active-bg); color: var(--btn-active-text); border-color: var(--btn-active-bg); }
.font-size-label { font-size: 12px; color: var(--text-muted); padding: 0 4px; }

.content-area { padding: 2rem; max-width: 860px; }
.pattern-header { margin-bottom: 1.5rem; }
.pattern-header h1 {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.2;
}
.pattern-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meta-tag {
  font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 20px;
}
.meta-divider { color: var(--text-hint); }
.pattern-short { font-size: 14px; color: var(--text-muted); }

.section { margin-bottom: 1.75rem; }
.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-hint);
  margin-bottom: 8px;
}
.scenario-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.65;
  box-shadow: var(--shadow-sm);
}
.scenario-card strong { color: var(--text); font-weight: 500; }

/* ── Code block ── */
.code-wrap {
  background: var(--code-bg);
  border: 0.5px solid var(--code-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.code-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  border-bottom: 0.5px solid var(--code-border);
  background: rgba(0,0,0,0.02);
}
[data-theme="dark"] .code-toolbar { background: rgba(255,255,255,0.02); }
.code-lang {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-hint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.copy-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--text-muted);
  background: transparent;
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.copy-btn:hover { background: var(--surface); color: var(--text); }
.copy-btn.copied { color: var(--tag-cr-text); border-color: var(--tag-cr-text); }

pre.code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  padding: 1.25rem 1.5rem;
  overflow-x: auto;
  background: transparent;
  tab-size: 4;
}
.fs-sm pre.code { font-size: 12px; }
.fs-lg pre.code { font-size: 14px; }

/* Syntax tokens */
.kw  { color: var(--token-kw); }
.ty  { color: var(--token-type); }
.st  { color: var(--token-str); }
.cm  { color: var(--token-cmt); font-style: italic; }
.nm  { color: var(--token-num); }

.tradeoffs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.trade-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 0.875rem 1rem;
  box-shadow: var(--shadow-sm);
}
.trade-card h4 {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.trade-card.pro h4 { color: var(--tag-cr-text); }
.trade-card.con h4 { color: #b45309; }
[data-theme="dark"] .trade-card.con h4 { color: #fb923c; }
[data-theme="sepia"] .trade-card.con h4 { color: #b45309; }
.trade-card ul { padding-left: 0; list-style: none; }
.trade-card li { font-size: 13px; color: var(--text-muted); padding: 2px 0; }
.trade-card li::before { content: "— "; color: var(--text-hint); }

.tip-box {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-left: 3px solid var(--text-hint);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 0.875rem 1rem;
  font-size: 13.5px;
  color: var(--text-muted);
  line-height: 1.6;
}
.tip-box strong { color: var(--text); font-weight: 500; }

/* Welcome screen */
.welcome {
  padding: 3rem 2rem;
  max-width: 600px;
}
.welcome h1 {
  font-family: 'Syne', sans-serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 1rem;
}
.welcome p { font-size: 15px; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.7; }
.stat-row { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
.stat { }
.stat .num { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; color: var(--text); }
.stat .lbl { font-size: 12px; color: var(--text-muted); }
.cat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 13px;
  cursor: pointer;
  transition: opacity 0.12s;
  border: 0.5px solid transparent;
}
.cat-pill:hover { opacity: 0.8; }
.cat-pill.cr { background: var(--tag-cr); color: var(--tag-cr-text); }
.cat-pill.st { background: var(--tag-st); color: var(--tag-st-text); }
.cat-pill.bh { background: var(--tag-bh); color: var(--tag-bh-text); }

/* Responsive */
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: -260px; z-index: 100; top: 0; transition: left 0.25s; height: 100vh; }
  .sidebar.open { left: 0; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
  .overlay.visible { display: block; }
  .tradeoffs { grid-template-columns: 1fr; }
  .hamburger { display: flex !important; }
}
.hamburger { display: none; }

/* Read mode */
.read-mode .sidebar { display: none; }
.read-mode .layout { grid-template-columns: 1fr; }
.read-mode .content-area { max-width: 680px; margin: 0 auto; }
.read-mode .topbar { max-width: 680px + 4rem; }
</style>
</head>
<body data-theme="light">

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="layout" id="layout">

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="brand">C# Reference</div>
    <div class="sidebar-title">GoF Design Patterns</div>
  </div>
  <div class="search-box">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search patterns…" oninput="filterNav(this.value)">
  </div>
  <div id="nav-content"></div>
</aside>

<!-- Main -->
<div class="main" id="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="icon-btn hamburger" id="hamburger" onclick="openSidebar()" title="Menu">☰</button>
      <div class="breadcrumb" id="breadcrumb">GoF Patterns</div>
    </div>
    <div class="topbar-right">
      <span class="font-size-label">A</span>
      <button class="icon-btn" onclick="setFontSize('sm')" id="fs-sm" title="Small text">−</button>
      <button class="icon-btn" onclick="setFontSize('md')" id="fs-md" title="Default text">◦</button>
      <button class="icon-btn" onclick="setFontSize('lg')" id="fs-lg" title="Large text">+</button>
      <div style="width:1px;height:20px;background:var(--border);margin:0 4px;"></div>
      <button class="icon-btn" id="btn-light" onclick="setTheme('light')" title="Light mode">☀</button>
      <button class="icon-btn" id="btn-sepia" onclick="setTheme('sepia')" title="Sepia / reading" title="Sepia mode">📖</button>
      <button class="icon-btn" id="btn-dark" onclick="setTheme('dark')" title="Dark mode">◑</button>
      <div style="width:1px;height:20px;background:var(--border);margin:0 4px;"></div>
      <button class="icon-btn" id="btn-read" onclick="toggleReadMode()" title="Focus / read mode">⊡</button>
    </div>
  </div>

  <div id="detail-area">
    <!-- welcome screen injected here -->
  </div>
</div>
</div>

<script>
const patterns = {
  creational: [
    {
      name: "Singleton",
      short: "One instance guaranteed",
      scenario: "A <strong>database connection manager</strong> must have exactly one instance across the entire application to avoid connection pool exhaustion. The Singleton ensures that every call to <code>Instance</code> returns the same object, initialized once via <code>Lazy&lt;T&gt;</code>.",
      code: `<span class="cm">// Thread-safe via Lazy&lt;T&gt; — no lock overhead after first access</span>
<span class="kw">public sealed class</span> <span class="ty">DbConnectionManager</span>
{
    <span class="kw">private static readonly</span> <span class="ty">Lazy</span>&lt;<span class="ty">DbConnectionManager</span>&gt; _instance =
        <span class="kw">new</span>(() =&gt; <span class="kw">new</span> <span class="ty">DbConnectionManager</span>());

    <span class="kw">public static</span> <span class="ty">DbConnectionManager</span> Instance =&gt; _instance.Value;

    <span class="kw">private</span> DbConnectionManager() { }   <span class="cm">// Prevent external construction</span>

    <span class="kw">public</span> <span class="ty">SqlConnection</span> GetConnection(<span class="kw">string</span> connStr)
        =&gt; <span class="kw">new</span> <span class="ty">SqlConnection</span>(connStr);
}

<span class="cm">// Usage</span>
<span class="kw">var</span> db = <span class="ty">DbConnectionManager</span>.Instance;
<span class="kw">var</span> conn = db.GetConnection(<span class="st">"Server=.;Database=App;"</span>);`,
      pros: ["Single point of initialization", "Thread-safe out of the box with Lazy<T>", "Lazy instantiation — pays only when used"],
      cons: ["Global state — harder to unit test", "Can hide dependencies (violates DI)", "Not suitable if multiple instances are ever needed"],
      tip: "<strong>Prefer dependency injection</strong> over Singleton in modern .NET apps. Register as <code>services.AddSingleton&lt;T&gt;()</code> so the container manages the lifetime and tests can swap it."
    },
    {
      name: "Factory Method",
      short: "Delegate object creation",
      scenario: "A <strong>payment gateway selector</strong> creates a Stripe, Razorpay, or PayPal processor based on runtime config — without the calling code knowing which concrete class it gets.",
      code: `<span class="kw">public interface</span> <span class="ty">IPaymentProcessor</span>
{
    <span class="kw">void</span> ProcessPayment(<span class="kw">decimal</span> amount);
}

<span class="kw">public class</span> <span class="ty">StripeProcessor</span> : <span class="ty">IPaymentProcessor</span>
{
    <span class="kw">public void</span> ProcessPayment(<span class="kw">decimal</span> amount)
        =&gt; <span class="ty">Console</span>.WriteLine(<span class="st">$"Stripe charging ₹{amount}"</span>);
}

<span class="kw">public class</span> <span class="ty">RazorpayProcessor</span> : <span class="ty">IPaymentProcessor</span>
{
    <span class="kw">public void</span> ProcessPayment(<span class="kw">decimal</span> amount)
        =&gt; <span class="ty">Console</span>.WriteLine(<span class="st">$"Razorpay charging ₹{amount}"</span>);
}

<span class="kw">public static class</span> <span class="ty">PaymentFactory</span>
{
    <span class="kw">public static</span> <span class="ty">IPaymentProcessor</span> Create(<span class="kw">string</span> gateway) =&gt; gateway <span class="kw">switch</span>
    {
        <span class="st">"stripe"</span>    =&gt; <span class="kw">new</span> <span class="ty">StripeProcessor</span>(),
        <span class="st">"razorpay"</span>  =&gt; <span class="kw">new</span> <span class="ty">RazorpayProcessor</span>(),
        _           =&gt; <span class="kw">throw new</span> <span class="ty">NotSupportedException</span>(<span class="st">$"Unknown: {gateway}"</span>)
    };
}

<span class="cm">// Usage</span>
<span class="ty">IPaymentProcessor</span> proc = <span class="ty">PaymentFactory</span>.Create(<span class="st">"razorpay"</span>);
proc.ProcessPayment(<span class="nm">5000</span>);`,
      pros: ["Decouples caller from concrete types", "New providers: just add a branch", "Easy to mock IPaymentProcessor in tests"],
      cons: ["Factory grows with every new type (OCP pressure)", "Switch expressions break for plugin/DI scenarios", "Static factory prevents polymorphic factories"],
      tip: "<strong>When the factory grows large</strong>, replace the switch with a dictionary: <code>Dictionary&lt;string, Func&lt;IPaymentProcessor&gt;&gt;</code> or use DI keyed services in .NET 8+."
    },
    {
      name: "Abstract Factory",
      short: "Family of related objects",
      scenario: "A <strong>cross-platform UI theme engine</strong> produces complete families of controls — Button, Checkbox, Input — for Light and Dark themes. Swap the factory, get a whole new consistent theme without touching consumer code.",
      code: `<span class="kw">public interface</span> <span class="ty">IButton</span>   { <span class="kw">void</span> Render(); }
<span class="kw">public interface</span> <span class="ty">ICheckbox</span> { <span class="kw">void</span> Render(); }

<span class="kw">public class</span> <span class="ty">LightButton</span>   : <span class="ty">IButton</span>   { <span class="kw">public void</span> Render() =&gt; <span class="ty">Console</span>.WriteLine(<span class="st">"☀ Light Button"</span>); }
<span class="kw">public class</span> <span class="ty">DarkButton</span>    : <span class="ty">IButton</span>   { <span class="kw">public void</span> Render() =&gt; <span class="ty">Console</span>.WriteLine(<span class="st">"◑ Dark Button"</span>);  }
<span class="kw">public class</span> <span class="ty">LightCheckbox</span> : <span class="ty">ICheckbox</span> { <span class="kw">public void</span> Render() =&gt; <span class="ty">Console</span>.WriteLine(<span class="st">"☀ Light Checkbox"</span>); }
<span class="kw">public class</span> <span class="ty">DarkCheckbox</span>  : <span class="ty">ICheckbox</span> { <span class="kw">public void</span> Render() =&gt; <span class="ty">Console</span>.WriteLine(<span class="st">"◑ Dark Checkbox"</span>);  }

<span class="kw">public interface</span> <span class="ty">IUIFactory</span>
{
    <span class="ty">IButton</span>   CreateButton();
    <span class="ty">ICheckbox</span> CreateCheckbox();
}

<span class="kw">public class</span> <span class="ty">LightThemeFactory</span> : <span class="ty">IUIFactory</span>
{

      name: "Builder",
      short: "Step-by-step construction",
      scenario: "An <strong>email composition API</strong> constructs complex Email objects with optional CC, BCC, attachments, and HTML bodies. The fluent builder eliminates massive constructor overloads and makes intent obvious at the call site.",
      code: `<span class="kw">public class</span> <span class="ty">Email</span>
{
    <span class="kw">public string</span> To      { <span class="kw">get</span>; <span class="kw">set</span>; } = <span class="kw">string</span>.Empty;
    <span class="kw">public string</span> Subject { <span class="kw">get</span>; <span class="kw">set</span>; } = <span class="kw">string</span>.Empty;
    <span class="kw">public string</span> Body    { <span class="kw">get</span>; <span class="kw">set</span>; } = <span class="kw">string</span>.Empty;
    <span class="kw">public</span> <span class="ty">List</span>&lt;<span class="kw">string</span>&gt; CC { <span class="kw">get</span>; <span class="kw">init</span>; } = <span class="kw">new</span>();
    <span class="kw">public bool</span> IsHtml    { <span class="kw">get</span>; <span class="kw">set</span>; }
}

<span class="kw">public class</span> <span class="ty">EmailBuilder</span>
{
    <span class="kw">private readonly</span> <span class="ty">Email</span> _email = <span class="kw">new</span>();

    <span class="kw">public</span> <span class="ty">EmailBuilder</span> To(<span class="kw">string</span> address)
        { _email.To = address; <span class="kw">return this</span>; }

    <span class="kw">public</span> <span class="ty">EmailBuilder</span> Subject(<span class="kw">string</span> subject)
        { _email.Subject = subject; <span class="kw">return this</span>; }

    <span class="kw">public</span> <span class="ty">EmailBuilder</span> HtmlBody(<span class="kw">string</span> html)
        { _email.Body = html; _email.IsHtml = <span class="kw">true</span>; <span class="kw">return this</span>; }

    <span class="kw">public</span> <span class="ty">EmailBuilder</span> CC(<span class="kw">string</span> address)
        { _email.CC.Add(address); <span class="kw">return this</span>; }

    <span class="cm">// Validate before handing off the object</span>
    <span class="kw">public</span> <span class="ty">Email</span> Build()
    {
        <span class="kw">if</span> (<span class="kw">string</span>.IsNullOrWhiteSpace(_email.To))
            <span class="kw">throw new</span> <span class="ty">InvalidOperationException</span>(<span class="st">"Recipient required"</span>);

    }
}

<span class="cm">// Usage — reads like a sentence</span>

    {
      name: "Prototype",
      short: "Clone existing objects",
      scenario: "A <strong>report template system</strong> stores pre-configured report layouts. Instead of rebuilding configs from scratch, departments clone the base template and tweak only what differs — avoiding expensive re-initialization.",
      code: `<span class="kw">public class</span> <span class="ty">ReportConfig</span> : <span class="ty">ICloneable</span>
{
    <span class="kw">public string</span> Title         { <span class="kw">get</span>; <span class="kw">set</span>; } = <span class="kw">string</span>.Empty;
    <span class="kw">public</span> <span class="ty">List</span>&lt;<span class="kw">string</span>&gt; Columns { <span class="kw">get</span>; <span class="kw">set</span>; } = <span class="kw">new</span>();
    <span class="kw">public bool</span> IncludeCharts   { <span class="kw">get</span>; <span class="kw">set</span>; }

    <span class="cm">// Deep clone — new List prevents shared reference mutation</span>

      pros: ["Avoids expensive re-initialization", "Clones are independent — no shared state", "Useful for undo/snapshot systems"],
      cons: ["Deep vs. shallow clone confusion is a common bug", "ICloneable.Clone() returns object — requires cast", "Complex object graphs (circular refs) are tricky to clone correctly"],

      short: "Uniform tree of objects",
      scenario: "A <strong>file system browser</strong> needs to calculate total size. Both individual files and nested folders respond to <code>GetSize()</code> — the caller doesn't need to know whether it's dealing with a leaf or a container.",
      code: `<span class="kw">public abstract class</span> <span class="ty">FileSystemItem</span>
{
    <span class="kw">public string</span> Name { <span class="kw">get</span>; }
    <span class="kw">protected</span> FileSystemItem(<span class="kw">string</span> name) =&gt; Name = name;
    <span class="kw">public abstract long</span> GetSize();

<span class="kw">public class</span> <span class="ty">FileLeaf</span> : <span class="ty">FileSystemItem</span>
{
    <span class="kw">private readonly long</span> _size;
    <span class="kw">public</span> FileLeaf(<span class="kw">string</span> name, <span class="kw">long</span> size) : <span class="kw">base</span>(name) =&gt; _size = size;
    <span class="kw">public override long</span> GetSize() =&gt; _size;
}

<span class="kw">public class</span> <span class="ty">Folder</span> : <span class="ty">FileSystemItem</span>
{
    <span class="kw">private readonly</span> <span class="ty">List</span>&lt;<span class="ty">FileSystemItem</span>&gt; _items = <span class="kw">new</span>();
    <span class="kw">public</span> Folder(<span class="kw">string</span> name) : <span class="kw">base</span>(name) { }
    <span class="kw">public void</span> Add(<span class="ty">FileSystemItem</span> item) =&gt; _items.Add(item);

<span class="cm">// Build the tree</span>

<span class="ty">Console</span>.WriteLine(<span class="st">$"Total: {root.GetSize()} bytes"</span>); <span class="cm">// 17408</span>`,
      pros: ["Uniform treatment of leaves and composites", "Easy to extend — add new node types freely", "Recursive algorithms become trivial"],
      cons: ["Hard to restrict which types can appear where", "Null-checking on optional operations (e.g. Add) can leak composite-awareness", "Deep trees can cause stack overflow on recursive traversal"],

    {
      name: "Proxy",
      short: "Controlled access / wrapper",
      scenario: "A <strong>caching weather proxy</strong> wraps an expensive HTTP weather API. It intercepts calls, returns cached results when available, and forwards only cache misses to the real API — without the caller knowing anything changed.",
      code: `<span class="kw">public interface</span> <span class="ty">IWeatherService</span>
{
    <span class="kw">string</span> GetWeather(<span class="kw">string</span> city);
}

<span class="kw">public class</span> <span class="ty">WeatherApi</span> : <span class="ty">IWeatherService</span>
{
    <span class="kw">public string</span> GetWeather(<span class="kw">string</span> city)
    {
        <span class="ty">Console</span>.WriteLine(<span class="st">$"[API] Calling weather service for {city}"</span>);
        <span class="kw">return</span> <span class="st">$"Sunny, 32°C in {city}"</span>;
    }
}

<span class="kw">public class</span> <span class="ty">CachingWeatherProxy</span> : <span class="ty">IWeatherService</span>
{
    <span class="kw">private readonly</span> <span class="ty">IWeatherService</span> _real = <span class="kw">new</span> <span class="ty">WeatherApi</span>();
    <span class="kw">private readonly</span> <span class="ty">Dictionary</span>&lt;<span class="kw">string</span>, <span class="kw">string</span>&gt; _cache = <span class="kw">new</span>();

    <span class="kw">public string</span> GetWeather(<span class="kw">string</span> city)
    {
        <span class="kw">if</span> (_cache.TryGetValue(city, <span class="kw">out var</span> cached))
        {
            <span class="ty">Console</span>.WriteLine(<span class="st">$"[CACHE HIT] {city}"</span>);
            <span class="kw">return</span> cached;
        }
        <span class="kw">var</span> result = _real.GetWeather(city);
        _cache[city] = result;
        <span class="kw">return</span> result;
    }
}

<span class="cm">// Callers are unchanged — they still use IWeatherService</span>
<span class="ty">IWeatherService</span> svc = <span class="kw">new</span> <span class="ty">CachingWeatherProxy</span>();

<span class="ty">Console</span>.WriteLine(svc.GetWeather(<span class="st">"Mumbai"</span>)); <span class="cm">// Cache hit</span>`,
      pros: ["Transparent to callers — same interface", "Cache, auth, logging, or rate limiting without touching real implementation", "Easy to compose multiple proxy behaviors"],
      cons: ["Can become a God proxy if you add too many responsibilities", "Cache invalidation is non-trivial in practice", "Stale data risk if real service updates aren't reflected"],
      tip: "<strong>DispatchProxy</strong> in .NET lets you generate proxies dynamically without writing wrapper classes. Consider <code>Castle DynamicProxy</code> for AOP-style proxying in production code."

    {
      name: "Flyweight",
      short: "Share expensive common state",
      scenario: "A <strong>2D game engine</strong> spawns 10,000 bullets. Each bullet shares its sprite texture and color (intrinsic state) via a factory — only position (extrinsic state) is stored per-instance, cutting memory from MBs to KBs.",
      code: `<span class="cm">// Intrinsic (shared) state — expensive, immutable</span>
<span class="kw">public class</span> <span class="ty">BulletType</span>
{
    <span class="kw">public string</span> Sprite { <span class="kw">get</span>; }
    <span class="kw">public string</span> Color  { <span class="kw">get</span>; }
    <span class="kw">public</span> BulletType(<span class="kw">string</span> sprite, <span class="kw">string</span> color)
        { Sprite = sprite; Color = color; }
}

<span class="cm">// Factory manages the shared pool</span>
<span class="kw">public static class</span> <span class="ty">BulletTypePool</span>
{
    <span class="kw">private static readonly</span> <span class="ty">Dictionary</span>&lt;<span class="kw">string</span>, <span class="ty">BulletType</span>&gt; _pool = <span class="kw">new</span>();

    <span class="kw">public static</span> <span class="ty">BulletType</span> Get(<span class="kw">string</span> key)
    {
        <span class="kw">if</span> (!_pool.ContainsKey(key))
            _pool[key] = <span class="kw">new</span> <span class="ty">BulletType</span>(key + <span class="st">".png"</span>, key);
        <span class="kw">return</span> _pool[key];
    }
    <span class="kw">public static int</span> PoolSize =&gt; _pool.Count;
}

<span class="cm">// Extrinsic (unique per instance) state</span>
<span class="kw">public class</span> <span class="ty">Bullet</span>
{
    <span class="kw">private readonly</span> <span class="ty">BulletType</span> _type; <span class="cm">// shared reference</span>
    <span class="kw">public float</span> X { <span class="kw">get</span>; <span class="kw">set</span>; }
    <span class="kw">public float</span> Y { <span class="kw">get</span>; <span class="kw">set</span>; }

    <span class="kw">public</span> Bullet(<span class="kw">string</span> typeName, <span class="kw">float</span> x, <span class="kw">float</span> y)
        { _type = <span class="ty">BulletTypePool</span>.Get(typeName); X = x; Y = y; }

    <span class="kw">public void</span> Draw() =&gt;
        <span class="ty">Console</span>.WriteLine(<span class="st">$"Drawing {_type.Sprite} [{_type.Color}] at ({X:F1},{Y:F1})"</span>);
}

<span class="cm">// 10,000 bullets — only 3 BulletType objects in memory</span>
<span class="kw">var</span> bullets = <span class="ty">Enumerable</span>.Range(<span class="nm">0</span>, <span class="nm">10_000</span>)
    .Select(i =&gt; <span class="kw">new</span> <span class="ty">Bullet</span>(i % <span class="nm">3</span> == <span class="nm">0</span> ? <span class="st">"red"</span> : i % <span class="nm">3</span> == <span class="nm">1</span> ? <span class="st">"blue"</span> : <span class="st">"green"</span>,
                             i * <span class="nm">0.1f</span>, i * <span class="nm">0.2f</span>))
    .ToList();
<span class="ty">Console</span>.WriteLine(<span class="st">$"Pool size: {BulletTypePool.PoolSize}"</span>); <span class="cm">// 3</span>`,
      pros: ["Massive memory savings for large object counts", "Shared state is immutable — thread-safe by construction", "Pool size is predictable and bounded"],
      cons: ["Intrinsic/extrinsic split adds conceptual complexity", "Not useful when most state differs between instances", "Pool can become a memory leak if objects are never evicted"],
      tip: "<strong>String interning in .NET is a built-in Flyweight</strong>. Use <code>string.Intern()</code> to understand the concept. For game/simulation work, also consider <code>struct</code> arrays (ECS pattern) as a memory-efficient alternative."

    {

      scenario: "An <strong>e-commerce checkout</strong> orchestrates inventory reservation, payment charging, and email confirmation — three separate subsystems. The facade exposes a single <code>PlaceOrder</code> call so the controller stays clean.",

{

<span class="cm">// Facade — one method hides the orchestration</span>
<span class="kw">public class</span> <span class="ty">CheckoutFacade</span>
{
    <span class="kw">private readonly</span> <span class="ty">InventoryService</span> _inv   = <span class="kw">new</span>();
    <span class="kw">private readonly</span> <span class="ty">PaymentService</span>   _pay   = <span class="kw">new</span>();
    <span class="kw">private readonly</span> <span class="ty">EmailService</span>     _email = <span class="kw">new</span>();

    <span class="kw">public bool</span> PlaceOrder(
        <span class="kw">int</span> productId, <span class="kw">int</span> qty, <span class="kw">string</span> card, <span class="kw">decimal</span> price, <span class="kw">string</span> email)

        <span class="kw">if</span> (!_pay.Charge(card, price))     <span class="kw">return false</span>;
        _email.SendConfirmation(email);
        <span class="kw">return true</span>;
    }
}

<span class="kw">public class</span> <span class="ty">AlertNotification</span> : <span class="ty">Notification</span>

// ── Category metadata ──────────────────────────────────────────────────────
const catMeta = {
  creational: { label: 'Creational', cls: 'cr' },
  structural:  { label: 'Structural',  cls: 'st' },
  behavioral:  { label: 'Behavioral',  cls: 'bh' }
};

// ── State ──────────────────────────────────────────────────────────────────
let currentPattern = null;
let currentTheme   = localStorage.getItem('gof-theme') || 'light';
let currentFs      = localStorage.getItem('gof-fs')    || 'md';

// ── Boot ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(currentTheme);
  applyFontSize(currentFs);
  renderNav('');
  renderWelcome();
});

// ── Theme ──────────────────────────────────────────────────────────────────
function setTheme(t) {
  applyTheme(t);
  localStorage.setItem('gof-theme', t);
}

function applyTheme(t) {
  currentTheme = t;
  document.body.setAttribute('data-theme', t);
  ['light', 'sepia', 'dark'].forEach(name => {
    const btn = document.getElementById('btn-' + name);
    if (btn) btn.classList.toggle('active', name === t);
  });
}

// ── Font size ──────────────────────────────────────────────────────────────
function setFontSize(size) {
  applyFontSize(size);
  localStorage.setItem('gof-fs', size);
}

function applyFontSize(size) {
  currentFs = size;
  document.body.classList.remove('fs-sm', 'fs-md', 'fs-lg');
  if (size !== 'md') document.body.classList.add('fs-' + size);
  ['sm', 'md', 'lg'].forEach(s => {
    const btn = document.getElementById('fs-' + s);
    if (btn) btn.classList.toggle('active', s === size);
  });
}

// ── Read mode ──────────────────────────────────────────────────────────────
function toggleReadMode() {
  const layout = document.getElementById('layout');
  const btn    = document.getElementById('btn-read');
  const isRead = layout.classList.toggle('read-mode');
  if (btn) btn.classList.toggle('active', isRead);
}

// ── Sidebar (mobile) ───────────────────────────────────────────────────────
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
}

// ── Nav rendering ──────────────────────────────────────────────────────────
function renderNav(query) {
  const q   = query.toLowerCase().trim();
  const nav = document.getElementById('nav-content');
  let html  = '';

  Object.entries(patterns).forEach(([cat, list]) => {
    const { label, cls } = catMeta[cat] || { label: cat, cls: 'cr' };
    const filtered = list.filter(p =>
      !q || p.name.toLowerCase().includes(q) || p.short.toLowerCase().includes(q)
    );
    if (!filtered.length) return;

    html += `<div class="cat-section">
      <div class="cat-label">
        <span class="cat-dot ${cls}"></span>${label}
      </div>`;

    filtered.forEach(p => {
      const isActive = currentPattern && currentPattern.name === p.name;
      html += `<div class="nav-item${isActive ? ' active' : ''}" onclick="showPattern('${cat}','${p.name}')">
        <span>${p.name}</span>
        <span class="tag ${cls}">${p.short}</span>
      </div>`;
    });

    html += '</div>';
  });

  nav.innerHTML = html || '<div style="padding:1rem 1.25rem;font-size:13px;color:var(--text-hint)">No patterns found</div>';
}

function filterNav(value) {
  renderNav(value);
}

// ── Pattern detail ─────────────────────────────────────────────────────────
function showPattern(cat, name) {
  const list = patterns[cat] || [];
  const p    = list.find(x => x.name === name);
  if (!p) return;

  currentPattern = { ...p, cat };
  closeSidebar();

  const { label, cls } = catMeta[cat] || { label: cat, cls: 'cr' };

  // Update breadcrumb
  const bc = document.getElementById('breadcrumb');
  if (bc) bc.innerHTML = `GoF Patterns &rsaquo; <span>${p.name}</span>`;

  // Pros / cons rows
  const proItems = p.pros.map(t => `<li>${t}</li>`).join('');
  const conItems = p.cons.map(t => `<li>${t}</li>`).join('');

  document.getElementById('detail-area').innerHTML = `
    <div class="content-area">
      <div class="pattern-header">
        <h1>${p.name}</h1>
        <div class="pattern-meta">
          <span class="meta-tag tag ${cls}">${label}</span>
          <span class="meta-divider">·</span>
          <span class="pattern-short">${p.short}</span>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Real-world scenario</div>
        <div class="scenario-card">${p.scenario}</div>
      </div>

        <div class="section-label">C# implementation</div>
        <div class="code-wrap">
          <div class="code-toolbar">
            <span class="code-lang">C#</span>
            <button class="copy-btn" id="copy-btn" onclick="copyCode()">Copy</button>
          </div>
          <pre class="code" id="code-block">${p.code}</pre>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Trade-offs</div>
        <div class="tradeoffs">
          <div class="trade-card pro">
            <h4>✓ Pros</h4>
            <ul>${proItems}</ul>
          </div>
          <div class="trade-card con">
            <h4>✗ Cons</h4>
            <ul>${conItems}</ul>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">C# tip</div>
        <div class="tip-box">${p.tip}</div>
      </div>
    </div>
  `;

  // Refresh nav active state
  renderNav(document.getElementById('search')?.value || '');
}

// ── Copy code ──────────────────────────────────────────────────────────────
function copyCode() {
  const block = document.getElementById('code-block');
  if (!block) return;

  // Strip HTML tags to get plain text
  const text = block.innerText || block.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    if (!btn) return;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity  = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

// ── Welcome screen ─────────────────────────────────────────────────────────
function renderWelcome() {
  const total      = Object.values(patterns).reduce((s, a) => s + a.length, 0);
  const catEntries = Object.entries(catMeta);

  const pillsHtml = catEntries.map(([cat, { label, cls }]) =>
    `<span class="cat-pill ${cls}" onclick="showPattern('${cat}','${patterns[cat][0].name}')">
       <span class="cat-dot ${cls}"></span>${label} (${patterns[cat].length})
     </span>`
  ).join('');

  const statHtml = catEntries.map(([cat, { label }]) =>
    `<div class="stat">
       <div class="num">${patterns[cat].length}</div>
       <div class="lbl">${label}</div>
     </div>`
  ).join('');

  document.getElementById('detail-area').innerHTML = `
    <div class="welcome">
      <h1>GoF Design Patterns<br>in C#</h1>
      <p>23 classic patterns with real-world C# scenarios, syntax-highlighted code, trade-off analysis, and modern .NET tips. Select a pattern from the sidebar to begin.</p>
      <div class="stat-row">
        <div class="stat"><div class="num">${total}</div><div class="lbl">Patterns</div></div>
        ${statHtml}
      </div>
      <div class="cat-pills">${pillsHtml}</div>
    </div>
  `;
}
</script>
