<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoF Design Patterns — C#</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --surface2: #f0ede8;
  --border: rgba(0,0,0,0.10);
  --border2: rgba(0,0,0,0.18);
  --text: #1a1917;
  --text2: #5c5a56;
  --text3: #9c9a95;
  --accent: #2d4a7a;
  --accent-bg: #e8edf5;
  --accent-text: #1e3361;
  --cr-bg: #eaf3e0; --cr-text: #2d5a1b; --cr-border: #b4d990;
  --st-bg: #ddeeff; --st-text: #0a3d6b; --st-border: #8ab8e8;
  --bh-bg: #fef3da; --bh-text: #6b3d0a; --bh-border: #f4c96a;
  --code-bg: #1e1e2e;
  --code-text: #cdd6f4;
  --kw: #cba6f7;
  --type: #89dceb;
  --str: #a6e3a1;
  --comment: #6c7086;
  --num: #fab387;
  --method: #89b4fa;
  --prop: #f5c2e7;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
  --radius: 10px;
  --radius-lg: 14px;
}
[data-theme="dark"] {
  --bg: #13120f;
  --surface: #1e1d1a;
  --surface2: #282520;
  --border: rgba(255,255,255,0.09);
  --border2: rgba(255,255,255,0.16);
  --text: #e8e5de;
  --text2: #9c9890;
  --text3: #5c5a54;
  --accent: #7aa2d4;
  --accent-bg: #1a2538;
  --accent-text: #9dbde8;
  --cr-bg: #1a2a10; --cr-text: #7ecf4a; --cr-border: #3a5a20;
  --st-bg: #0e1e30; --st-text: #6baee8; --st-border: #1a3a58;
  --bh-bg: #2a1e08; --bh-text: #e8aa4a; --bh-border: #5a3e10;
  --code-bg: #11111b;
  --shadow: 0 2px 20px rgba(0,0,0,0.4);
}
[data-theme="read"] {
  --bg: #faf8f3;
  --surface: #fdf9f2;
  --surface2: #f5f0e8;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --text: #2c2416;
  --text2: #6b5e4a;
  --text3: #a89b88;
  --accent: #8b4513;
  --accent-bg: #f5ede0;
  --accent-text: #6b3410;
  --cr-bg: #eaf3e0; --cr-text: #2d5a1b; --cr-border: #c8e8a8;
  --st-bg: #e0eeff; --st-text: #1a3d6b; --st-border: #a0c8f0;
  --bh-bg: #fff8e8; --bh-text: #6b3d0a; --bh-border: #f0d890;
  --code-bg: #2d2016;
  --code-text: #e8d8b8;
  --kw: #e8a060;
  --type: #60b8d8;
  --str: #78b868;
  --comment: #887060;
  --num: #d8906a;
  --method: #78a8d8;
  --prop: #d8a8c8;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.25s, color 0.25s;
}

.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  background: var(--surface);
  border-right: 0.5px solid var(--border2);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.sidebar-head {
  padding: 20px 18px 12px;
  border-bottom: 0.5px solid var(--border);
}
.sidebar-head h1 {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.3;
  color: var(--text);
  margin-bottom: 12px;
}
.sidebar-head h1 span { color: var(--text3); font-style: italic; }

.search-wrap { position: relative; }
.search-wrap input {
  width: 100%;
  padding: 7px 10px 7px 32px;
  border: 0.5px solid var(--border2);
  border-radius: 7px;
  background: var(--surface2);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text3); }
.search-icon {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  font-size: 13px;
  pointer-events: none;
}

.cat-section { padding: 10px 0; }
.cat-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 6px 18px 4px;
  color: var(--text3);
}
.pat-btn {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 7px 18px;
  background: none;
  border: none;
  text-align: left;
  cursor: pointer;
  color: var(--text2);
  font-family: inherit;
  font-size: 13px;
  gap: 8px;
  border-left: 2px solid transparent;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.pat-btn:hover { background: var(--surface2); color: var(--text); }
.pat-btn.active {
  background: var(--accent-bg);
  color: var(--accent-text);
  font-weight: 500;
  border-left-color: var(--accent);
}
.pat-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.pat-btn.active .pat-dot { background: var(--accent); }
.cr-dot { background: #5a9e2a; }
.st-dot { background: #2a6eae; }
.bh-dot { background: #b87a0a; }

/* MAIN */
.main { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 0.5px solid var(--border);
  padding: 10px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  backdrop-filter: blur(8px);
}
.breadcrumb { font-size: 13px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.breadcrumb strong { color: var(--text); font-weight: 500; }

.controls { display: flex; align-items: center; gap: 8px; }
.ctrl-btn {
  padding: 5px 12px;
  border: 0.5px solid var(--border2);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text2);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.ctrl-btn:hover { background: var(--surface2); color: var(--text); }
.ctrl-btn.active { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent); }
.ctrl-sep { width: 0.5px; height: 20px; background: var(--border2); }

.content {
  flex: 1;
  padding: 32px;
  max-width: 820px;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60vh;
  color: var(--text3);
  text-align: center;
  gap: 12px;
}
.empty-state .big { font-size: 40px; line-height: 1; }
.empty-state p { font-size: 15px; }
.empty-state small { font-size: 13px; color: var(--text3); }

/* PATTERN CARD */
.pat-header { margin-bottom: 24px; }
.cat-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 10px;
}
.cat-badge.creational { background: var(--cr-bg); color: var(--cr-text); }
.cat-badge.structural { background: var(--st-bg); color: var(--st-text); }
.cat-badge.behavioral { background: var(--bh-bg); color: var(--bh-text); }

.pat-title {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 32px;
  font-weight: 400;
  line-height: 1.15;
  color: var(--text);
  margin-bottom: 6px;
}
.pat-short {
  font-size: 15px;
  color: var(--text2);
  font-style: italic;
  margin-bottom: 16px;
}

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.info-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.info-card .label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
}
.info-card p {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text2);
}
.info-card.full { grid-column: 1 / -1; }

/* CODE BLOCK */
.code-wrap {
  background: var(--code-bg);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  margin-bottom: 28px;
}
.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 0.5px solid rgba(255,255,255,0.06);
  background: rgba(0,0,0,0.2);
}
.code-lang {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.05em;
}
.dots { display: flex; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #ff5f57; }
.dot-y { background: #ffbd2e; }
.dot-g { background: #28c840; }
.copy-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  background: none;
  border: 0.5px solid rgba(255,255,255,0.12);
  border-radius: 5px;
  padding: 3px 9px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.copy-btn:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.25); }
.copy-btn.copied { color: #a6e3a1; border-color: rgba(166,227,161,0.4); }

.code-scroll { overflow-x: auto; padding: 18px 20px; }
.code-scroll::-webkit-scrollbar { height: 4px; }
.code-scroll::-webkit-scrollbar-track { background: transparent; }
.code-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

pre {
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 12.5px;
  line-height: 1.75;
  white-space: pre;
  color: var(--code-text);
}

/* Syntax highlighting classes */
.kw { color: var(--kw); }
.ty { color: var(--type); }
.st { color: var(--str); }
.cm { color: var(--comment); font-style: italic; }
.nu { color: var(--num); }
.me { color: var(--method); }
.pr { color: var(--prop); }

/* TRADE-OFFS */
.tradeoffs {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 28px;
}
.tradeoffs .label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
}
.tradeoffs ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.tradeoffs li {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.5;
  padding-left: 18px;
  position: relative;
}
.tradeoffs li::before {
  content: attr(data-icon);
  position: absolute;
  left: 0;
}

/* NAV */
.pat-nav {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding-top: 12px;
  border-top: 0.5px solid var(--border);
}
.nav-btn {
  flex: 1;
  padding: 10px 14px;
  background: var(--surface);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius);
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  color: var(--text2);
  transition: all 0.12s;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-btn:hover { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent); }
.nav-btn .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); }
.nav-btn:hover .nav-label { color: inherit; opacity: 0.7; }
.nav-btn.next { text-align: right; }

/* OVERVIEW GRID */
.overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.ov-cat { margin-bottom: 28px; }
.ov-cat-title {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 22px;
  font-weight: 400;
  margin-bottom: 14px;
  color: var(--text);
}
.ov-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
}
.ov-card:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}
.ov-card .ov-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.ov-card .ov-desc { font-size: 12px; color: var(--text3); line-height: 1.4; }
.ov-card:hover .ov-name { color: var(--accent-text); }

/* FONT SIZE CONTROL */
[data-fontsize="sm"] .content { font-size: 14px; }
[data-fontsize="lg"] .content pre { font-size: 13.5px; }
[data-fontsize="lg"] .content .pat-title { font-size: 36px; }

/* Scrollbar */
.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .content { padding: 20px; }
  .topbar { padding: 10px 20px; }
  .info-grid { grid-template-columns: 1fr; }
  .overview-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h1>GoF Patterns<br><span>in C#</span></h1>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search" placeholder="Search patterns…" oninput="filterPatterns(this.value)">
      </div>
    </div>
    <div id="nav-list"></div>
  </aside>

  <div class="main" id="main-scroll">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb">
        <span>GoF Patterns</span>
      </div>
      <div class="controls">
        <button class="ctrl-btn active" id="btn-light" onclick="setTheme('light', this)">☀ Light</button>
        <button class="ctrl-btn" id="btn-dark" onclick="setTheme('dark', this)">☽ Dark</button>
        <button class="ctrl-btn" id="btn-read" onclick="setTheme('read', this)">📖 Read</button>
        <div class="ctrl-sep"></div>
        <button class="ctrl-btn" onclick="changeFontSize()" id="fs-btn" title="Toggle font size">Aa</button>
        <button class="ctrl-btn" onclick="showOverview()" id="ov-btn">≡ All</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="empty-state" id="landing">
        <div class="big">⬡</div>
        <p>Select a pattern from the sidebar</p>
        <small>23 patterns · Creational · Structural · Behavioral</small>
        <br>
        <button class="ctrl-btn" onclick="showOverview()" style="margin-top:8px">View all patterns →</button>
      </div>
    </div>
  </div>
</div>

<script>
const patterns = {
  creational: [
    {
      name: "Singleton",
      short: "One instance, globally accessible",
      usecase: "Database connection pool. Ensures exactly one DbConnectionManager exists across the entire app lifetime — avoids connection storms from duplicate instantiation.",
      when: "Use when a single shared resource (logger, config, cache) must be exactly one instance. Avoid when you actually need multiple instances or when it hampers testability.",
      code: `public sealed class DbConnectionManager
{
    private static readonly Lazy<DbConnectionManager> _instance =
        new(() => new DbConnectionManager());

    public static DbConnectionManager Instance => _instance.Value;

    private DbConnectionManager() { }  // prevent direct construction

    public SqlConnection GetConnection(string connStr)
        => new SqlConnection(connStr);
}

// Usage
var db  = DbConnectionManager.Instance;
var db2 = DbConnectionManager.Instance;  // same object
var conn = db.GetConnection("Server=.;Database=App;");`,
      tradeoffs: [
        { icon: "⚠", text: "Global state makes unit testing hard — use DI container with singleton lifetime instead." },
        { icon: "✓", text: "Lazy<T> gives thread-safe, deferred initialization without locking boilerplate." },
        { icon: "⚠", text: "Sealed + private ctor prevents accidental subclassing or reflection abuse." },
      ]
    },
    {
      name: "Factory Method",
      short: "Delegate object creation to subclasses",
      usecase: "Payment gateway selection. Caller requests a processor by name; factory encapsulates which concrete class to instantiate (Stripe, Razorpay, etc.) without exposing constructors.",
      when: "Use when the exact type to create isn't known until runtime, or when centralizing creation logic reduces scattered `new` calls. Prefer over a massive switch-case in application code.",
      code: `public interface IPaymentProcessor
{
    void ProcessPayment(decimal amount);
}

public class StripeProcessor : IPaymentProcessor
{
    public void ProcessPayment(decimal amount)
        => Console.WriteLine($"Stripe: charging ₹{amount:N2}");
}

public class RazorpayProcessor : IPaymentProcessor
{
    public void ProcessPayment(decimal amount)
        => Console.WriteLine($"Razorpay: charging ₹{amount:N2}");
}

public static class PaymentFactory
{
    public static IPaymentProcessor Create(string gateway) => gateway switch
    {
        "stripe"   => new StripeProcessor(),
        "razorpay" => new RazorpayProcessor(),
        _          => throw new NotSupportedException(
                           $"Gateway '{gateway}' not supported")
    };
}

// Usage — caller never touches concrete classes
IPaymentProcessor proc = PaymentFactory.Create("razorpay");
proc.ProcessPayment(4999.00m);`,
      tradeoffs: [
        { icon: "✓", text: "Isolates object creation; adding a new gateway only touches the factory." },
        { icon: "⚠", text: "Switch grows with each new type — consider a registry (Dictionary<string, Func<IPaymentProcessor>>) for extensibility." },
        { icon: "✓", text: "Works naturally with DI: register IPaymentProcessor and resolve by key." },
      ]
    },
    {
      name: "Abstract Factory",
      short: "Produce families of related objects",
      usecase: "UI theme engine. A factory produces a matched set of themed components (Button + Checkbox) for Light or Dark mode — guarantees they're always from the same family without coupling to concrete types.",
      when: "Use when you need consistent families of related objects and want to enforce that mixing (e.g. LightButton + DarkCheckbox) never happens.",
      code: `public interface IButton   { void Render(); }
public interface ICheckbox { void Render(); }

public class LightButton   : IButton   { public void Render() => Console.WriteLine("☀ Light Button");   }
public class DarkButton    : IButton   { public void Render() => Console.WriteLine("☾ Dark Button");    }
public class LightCheckbox : ICheckbox { public void Render() => Console.WriteLine("☀ Light Checkbox"); }
public class DarkCheckbox  : ICheckbox { public void Render() => Console.WriteLine("☾ Dark Checkbox");  }

public interface IUIFactory
{
    IButton   CreateButton();
    ICheckbox CreateCheckbox();
}

public class LightThemeFactory : IUIFactory
{
    public IButton   CreateButton()   => new LightButton();
    public ICheckbox CreateCheckbox() => new LightCheckbox();
}

public class DarkThemeFactory : IUIFactory
{
    public IButton   CreateButton()   => new DarkButton();
    public ICheckbox CreateCheckbox() => new DarkCheckbox();
}

// Usage
IUIFactory ui = new DarkThemeFactory();  // swap factory, swap theme
ui.CreateButton().Render();    // ☾ Dark Button
ui.CreateCheckbox().Render();  // ☾ Dark Checkbox`,
      tradeoffs: [
        { icon: "✓", text: "Adding a new theme is a single new factory class — zero changes to consumers." },
        { icon: "⚠", text: "Adding a new product (e.g. ISlider) forces changes to every factory — costly if done often." },
        { icon: "✓", text: "Enforces product family consistency at compile time." },
      ]
    },
    {
      name: "Builder",
      short: "Construct complex objects step by step",
      usecase: "Email construction. An EmailBuilder chains optional fields (CC, BCC, HTML body, attachments) via fluent methods, producing a validated Email only when Build() is called.",
      when: "Use when an object has many optional parameters and telescoping constructors become unreadable. Strongly prefer over constructors with 5+ arguments.",
      code: `public class Email
{
    public string       To      { get; init; }
    public string       Subject { get; init; }
    public string       Body    { get; init; }
    public bool         IsHtml  { get; init; }
    public List<string> CC      { get; init; } = new();
}

public class EmailBuilder
{
    private string       _to, _subject, _body;
    private bool         _isHtml;
    private List<string> _cc = new();

    public EmailBuilder To(string address)      { _to      = address; return this; }
    public EmailBuilder Subject(string subject) { _subject = subject; return this; }
    public EmailBuilder TextBody(string text)   { _body    = text;    return this; }
    public EmailBuilder HtmlBody(string html)   { _body    = html; _isHtml = true; return this; }
    public EmailBuilder CC(string address)      { _cc.Add(address);   return this; }

    public Email Build()
    {
        if (string.IsNullOrWhiteSpace(_to)) throw new InvalidOperationException("To is required");
        return new Email { To = _to, Subject = _subject, Body = _body,
                           IsHtml = _isHtml, CC = _cc };
    }
}

{
    public List<int> Sort(List<int> data)

public abstract class Middleware
{
    protected Middleware? Next;

    public Middleware SetNext(Middleware next) { Next = next; return next; }

    public abstract void Handle(HttpRequest req);
}

public class AuthMiddleware : Middleware
{
    public override void Handle(HttpRequest req)
    {
        if (string.IsNullOrEmpty(req.Token))
        { Console.WriteLine("401 Unauthorized — missing token"); return; }

        Console.WriteLine("[Auth] ✓ token valid");
        Next?.Handle(req);
    }
}

public class RateLimitMiddleware : Middleware
{
    private const int Limit = 100;

    public override void Handle(HttpRequest req)
    {
        if (req.RequestsPerMin > Limit)
        { Console.WriteLine($"429 Too Many Requests ({req.RequestsPerMin}/min)"); return; }

        Console.WriteLine($"[Rate] ✓ {req.RequestsPerMin}/min ≤ {Limit}");
        Next?.Handle(req);
    }
}

public class LoggingMiddleware : Middleware
{
    public override void Handle(HttpRequest req)
    {
        Console.WriteLine($"[Log] {req.Path}");
        Next?.Handle(req);  // no short-circuit here
    }
}

// Highlight runs on RAW source code, not HTML-escaped code.
// We set innerHTML on <pre> directly — the browser handles text escaping for us
// via textContent first, then we inject only our known-safe <span> tags.
function syntaxHighlight(rawCode) {
  // Step 1: tokenise the raw source into segments
  // We'll build an array of {text, cls} tokens
  const tokens = [];
  let remaining = rawCode;

  // Regex patterns applied in priority order against raw source
  const tokenPatterns = [
    // Single-line comments
    { re: /^(\/\/[^\n]*)/, cls: 'cm' },
    // Verbatim strings @"..."
    { re: /^(@"(?:[^"]|"")*")/, cls: 'st' },
    // Interpolated strings $"..."
    { re: /^(\$"(?:[^"\\]|\\.)*")/, cls: 'st' },
    // Regular strings "..."
    { re: /^("(?:[^"\\]|\\.)*")/, cls: 'st' },
    // Keywords (whole word)
    { re: /^(public|private|protected|internal|sealed|static|readonly|abstract|virtual|override|new|class|interface|record|using|namespace|return|void|var|if|else|foreach|for|do|while|in|out|ref|this|base|null|true|false|throw|try|catch|const|get|set|init|params|where|select|async|await|yield|switch|case|break|default|is|as)\b/, cls: 'kw' },
    // Built-in types
    { re: /^(string|int|bool|float|decimal|long|double|object)\b/, cls: 'kw' },
    // Known types (capitalised)
    { re: /^(List|Dictionary|Stack|IEnumerable|IEnumerator|Func|Action|Lazy|SqlConnection|Console|Guid|Math|Enumerable|DateTime|Task|InvalidOperationException|NotSupportedException|ArgumentException|ICloneable)\b/, cls: 'ty' },
    // Numbers
    { re: /^(\d[\d_]*(?:\.\d+)?[mMfFdDlL]?)(?!\w)/, cls: 'nu' },
    // Method calls: Word( — capitalised
    { re: /^([A-Z][A-Za-z0-9]*)(?=\s*\()/, cls: 'me' },
    // Property access: .UpperWord (not followed by ()
    { re: /^(\.)([A-Z][A-Za-z0-9]*)(?!\s*\()/, cls: null, special: 'prop' },
    // Any other single character (advance one at a time)
    { re: /^([\s\S])/, cls: null },
  ];

  while (remaining.length > 0) {
    let matched = false;
    for (const pat of tokenPatterns) {
      const m = pat.re.exec(remaining);
      if (!m) continue;
      if (pat.special === 'prop') {
        tokens.push({ text: '.', cls: null });
        tokens.push({ text: m[2], cls: 'pr' });
      } else {
        tokens.push({ text: m[1] || m[0], cls: pat.cls });
      }
      remaining = remaining.slice(m[0].length);
      matched = true;
      break;
    }
    if (!matched) { tokens.push({ text: remaining[0], cls: null }); remaining = remaining.slice(1); }
  }

  // Step 2: build HTML from tokens — escape each text fragment with textContent trick
  const temp = document.createElement('span');
  let html = '';
  for (const tok of tokens) {
    temp.textContent = tok.text;
    const safe = temp.innerHTML;
    html += tok.cls ? `<span class="${tok.cls}">${safe}</span>` : safe;
  }
  return html;
}
